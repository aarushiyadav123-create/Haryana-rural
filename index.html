<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा गाँव - सम्पूर्ण हरियाणा ग्रामीण सेवा</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f6f9; padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 550px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
        h2 { color: #1b5e20; text-align: center; margin-bottom: 20px; font-size: 1.4rem; }
        .form-group { margin-bottom: 18px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.95rem; }
        select, input[type="text"] { width: 100%; padding: 12px; border: 1px solid #b0bec5; border-radius: 8px; font-size: 1rem; outline: none; background: #fff; }
        select:focus, input[type="text"]:focus { border-color: #1b5e20; }
        .btn { background: #1b5e20; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #113f14; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #e8f5e9; border: 1px solid #a5d6a7; display: none; }
        .hint { font-size: 0.8rem; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌾 MeraGaov - Smart Search Haryana</h2>

    <!-- 1. District -->
    <div class="form-group">
        <label>1. जिला (District):</label>
        <select id="distSelect" onchange="loadBlocks()">
            <option value="">-- जिला चुनें --</option>
        </select>
    </div>

    <!-- 2. Block -->
    <div class="form-group">
        <label>2. खण्ड (Block):</label>
        <select id="blockSelect" onchange="enableVillageInput()">
            <option value="">-- पहले जिला चुनें --</option>
        </select>
    </div>

    <!-- 3. Village (Smart Search Box) -->
    <div class="form-group">
        <label>3. गाँव खोजें (Search Village):</label>
        <input type="text" id="villageInput" placeholder="गाँव का नाम टाइप करें (जैसे: Lahli)..." list="villageList" disabled>
        <datalist id="villageList"></datalist>
        <div class="hint">💡 टाइप करते ही गाँव अपने आप आ जाएगा!</div>
    </div>

    <button class="btn" onclick="showData()">विवरण देखें (View Details)</button>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    // Comprehensive Master Database for Haryana Blocks
    const masterDB = {
        "ROHTAK": {
            "KALANAUR": ["Anwal", "Basana", "Bhaini Surjan", "Garnauthi", "Gudhan", "Kahnaur", "Kairi", "Kalanaur Khas", "Kalanaur Rural", "Katesara", "Katwara", "Lahli", "Masudpur", "Nigana", "Pilana", "Saimpal", "Sundpur"],
            "SAMPLA": ["Atail", "Balku", "Baproda", "Bhadhadu", "Chandi", "Dattaur", "Gandhra", "Garhi Sampla", "Ghashi", "Gijhi", "Hasangarh", "Ismaila 11B", "Ismaila 9B", "Kharhar", "Kheri Sampla", "Kultana", "Naya Bans", "Nonand", "Paksam", "Rohad", "Sampla"],
            "ROHTAK": ["Asthal Bohar", "Baland", "Bhalout", "Bohar", "Bahu Akbarpur", "Dobh", "Garhi Majra", "Karor", "Kharawar", "Kheri Sadh", "Makrauli Kalan", "Makrauli Khurd", "Paharipur", "Rohtak Rural", "Samar Gopalpur", "Shimli", "Sukhpura", "Sunaria Kalan", "Sunaria Khurd"],
            "MEHAM": ["Baini Chanderpal", "Baini City", "Baini Surjan", "Bedwa", "Bhaini Maharajpur", "Farmana", "Kharkara", "Kishan Garh", "Madina Gindhran", "Madina Korsan", "Meham", "Mokhra Bahi", "Mokhra Khas", "Nidana", "Sarsa", "Semnan"],
            "LAKHAN MAJRA": ["Brahmanwas", "Chandi", "Gharawathi", "Indergarh", "Kharak Jattan", "Lakhan Majra", "Nandwal", "Naya Bans", "Titian"]
        },
        "CHARKHI DADRI": {
            "BAUND": ["Achina", "Akbarpur", "Balgarh", "Bas Ranila", "Baund Kalan", "Baund Khurd", "Bhagwi", "Dhani Phogat", "Gharethi", "Hindol", "Kalyana", "Kasni", "Mankawas", "Phogat", "Ranila", "Sanjarwas", "Sankrod", "Sanwar", "Unghanwas"],
            "CHARKHI DADRI": ["Adalpur", "Bhiwani Gate", "Birhi Kalan", "Birhi Khurd", "Charkhi", "Chhapar", "Dadri Rural", "Dhani", "Iri", "Jhagroli", "Jhojhu Kalan", "Kachri", "Kamodh", "Khedi Bura", "Loharwara", "Mehrana", "Ramalwas", "Rawaldhi", "Samaspur", "Santokhpura", "Sarni", "Tikan Kalan"],
            "BADHRA": ["Badhra", "Chandwas", "Chhapar", "Dwarka", "Goverdhanpura", "Ghuiyani", "Hansiwas", "Jhojhu Khurd", "Kadma", "Kallana", "Kari Mod", "Kari Rupa", "Kari Tokha", "Kheri Bura", "Lad", "Lawa", "Mandola", "Nindana", "Penchead", "Surpura"]
        },
        "JHAJJAR": {
            "JHAJJAR": ["Bikaner", "Bhurawas", "Chhuchhakwas", "Dadhlan", "Dhani", "Giani", "Girawar", "Goria", "Gudha", "Jhajjar Rural", "Kheri Khummar", "Kutani", "Marot", "Raiya", "Salhawas", "Silani", "Suhra", "Talao"],
            "BAHADURGARH": ["Asaudha Siwan", "Asaudha Todran", "Bahadurgarh Rural", "Bamnoli", "Barahi", "Daboda Kalan", "Daboda Khurd", "Jasaur Kheri", "Kanonda", "Kassandesh", "Kharhar", "Luksar", "Mukundpur", "Nilothi", "Nuna Majra", "Rohad", "Sankhol", "Sidhipur Lova", "Soldha", "Zahidpur"],
            "BERI": ["Baghpur", "Bakra", "Beri", "Bisahan", "Chimni", "Chhara", "Dighal", "Dubaldhan", "Gangtan", "Gochhi", "Lakria", "Majra", "Pahanpur", "Palra", "Wazirpur"],
            "BADLI": ["Badli", "Bupania", "Dulhera", "Gubhana", "Lagarpur", "Machhrauli", "Majri", "Munimpur", "Pahori", "Pelpa", "Silana", "Sillani", "Sondhi", "Yakubpur"]
        }
    };

    window.onload = function() {
        let dist = document.getElementById('distSelect');
        for (let d in masterDB) {
            let opt = document.createElement('option');
            opt.value = d;
            opt.innerText = d;
            dist.appendChild(opt);
        }
    };

    function loadBlocks() {
        let d = document.getElementById('distSelect').value;
        let block = document.getElementById('blockSelect');
        let villageInput = document.getElementById('villageInput');
        
        block.innerHTML = '<option value="">-- खण्ड / Block चुनें --</option>';
        villageInput.value = '';
        villageInput.disabled = true;
        document.getElementById('villageList').innerHTML = '';

        if (d && masterDB[d]) {
            for (let b in masterDB[d]) {
                let opt = document.createElement('option');
                opt.value = b;
                opt.innerText = b;
                block.appendChild(opt);
            }
        }
    }

    function enableVillageInput() {
        let d = document.getElementById('distSelect').value;
        let b = document.getElementById('blockSelect').value;
        let villageInput = document.getElementById('villageInput');
        let dataList = document.getElementById('villageList');

        villageInput.value = '';
        dataList.innerHTML = '';

        if (d && b && masterDB[d][b]) {
            villageInput.disabled = false;
            masterDB[d][b].sort().forEach(v => {
                let opt = document.createElement('option');
                opt.value = v;
                dataList.appendChild(opt);
            });
        } else {
            villageInput.disabled = true;
        }
    }

    function showData() {
        let d = document.getElementById('distSelect').value;
        let b = document.getElementById('blockSelect').value;
        let v = document.getElementById('villageInput').value;

        if (!d || !b || !v) {
            alert('कृपया जिला, ब्लॉक और गाँव का नाम सही से भरें!');
            return;
        }

        let res = document.getElementById('resultBox');
        res.style.display = 'block';
        res.innerHTML = `<strong>📍 चयनित विवरण:</strong><br>जिला: ${d}<br>ब्लॉक: ${b}<br>गाँव: ${v}`;
    }
</script>

</body>
</html>
