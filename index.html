<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लोकल डिजिटल पोर्टल</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        /* पुरानी ग्रीन थीम */
        header { background-color: #2e7d32; color: white; padding: 15px; text-align: center; }
        .ram-ram { background-color: #c8e6c9; color: #1b5e20; padding: 10px; text-align: center; font-weight: bold; }
        .container { padding: 15px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .app-btn { background: white; border: 2px solid #2e7d32; padding: 15px; border-radius: 8px; text-align: center; color: #2e7d32; font-weight: bold; cursor: pointer; }
        
        /* नया डिस्प्ले एरिया */
        #display-area { background: white; border: 2px solid #2e7d32; padding: 15px; border-radius: 8px; margin-top: 10px; display: none; }
        .close-btn { background: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; float: right; }
        
        /* एडमिन बटन */
        .admin-area { text-align: center; margin-top: 20px; opacity: 0.05; }
        .admin-area:hover { opacity: 1; }
    </style>
</head>
<body>

    <header><h1>गाँव और ज़िला पोर्टल</h1></header>
    <div class="ram-ram">🙏 राम-राम भाइयो!</div>

    <div class="container">
        <div class="btn-grid">
            <div class="app-btn" onclick="show('📍 Nearby Search')">My Nearby Search</div>
            <div class="app-btn" onclick="show('📂 Categories')">सभी कैटेगरीज</div>
            <div class="app-btn" onclick="show('🎭 मनोरंजन')">मनोरंजन & जोक्स</div>
            <div class="app-btn" onclick="show('📷 Shop QR')">Shop QR</div>
        </div>

        <div id="display-area">
            <button class="close-btn" onclick="hide()">बंद करें</button>
            <div id="content"></div>
        </div>
    </div>

    <div class="admin-area">
        <button onclick="adminLogin()">Admin Login</button>
    </div>

    <script>
        function show(text) {
            document.getElementById('content').innerHTML = "<h3>" + text + "</h3><p>यहाँ जानकारी अपडेट हो रही है...</p>";
            document.getElementById('display-area').style.display = "block";
        }
        function hide() { document.getElementById('display-area').style.display = "none"; }
        
        function adminLogin() {
            let pass = prompt("पासवर्ड दर्ज करें:");
            if (pass === "sub123") alert("लॉगिन सफल!");
            else alert("गलत पासवर्ड!");
        }
    </script>
</body>
</html>
