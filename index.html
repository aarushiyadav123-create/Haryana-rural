<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा गाँव - सटीक हरियाणा सेवा</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f6f9; padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 550px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
        h2 { color: #1b5e20; text-align: center; margin-bottom: 20px; font-size: 1.4rem; }
        .form-group { margin-bottom: 18px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.95rem; }
        select { width: 100%; padding: 12px; border: 1px solid #b0bec5; border-radius: 8px; font-size: 1rem; outline: none; background: #fff; cursor: pointer; }
        select:focus { border-color: #1b5e20; }
        .btn { background: #1b5e20; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #113f14; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #e8f5e9; border: 1px solid #a5d6a7; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌾 MeraGaov - Haryana Official Hierarchy</h2>

    <!-- 1. District -->
    <div class="form-group">
        <label>1. जिला (District):</label>
        <select id="distSelect" onchange="loadAreas()">
            <option value="">-- जिला चुनें --</option>
        </select>
    </div>

    <!-- 2. Area -->
    <div class="form-group">
        <label>2. सब-डिविजन / एरिया (Area):</label>
        <select id="areaSelect" onchange="loadBlocks()">
            <option value="">-- पहले जिला चुनें --</option>
        </select>
    </div>

    <!-- 3. Block -->
    <div class="form-group">
        <label>3. खण्ड (Block):</label>
        <select id="blockSelect" onchange="loadVillages()">
            <option value="">-- पहले एरिया चुनें --</option>
        </select>
    </div>

    <!-- 4. Village -->
    <div class="form-group">
        <label>4. गाँव (Village):</label>
        <select id="villageSelect">
            <option value="">-- पहले ब्लॉक चुनें --</option>
        </select>
    </div>

    <button class="btn" onclick="showData()">विवरण देखें (View Details)</button>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    // Strict Structure: District -> Area -> Block -> Villages
    const db = {
        "CHARKHI DADRI": {
            "CHARKHI DADRI SUB-DIVISION": {
                "CHARKHI DADRI": ["Dadri Rural", "Jhojhu Kalan", "Kachri", "Ramalwas", "Sarni", "Mankawas", "Phogat", "Chhapar", "Iri", "Samaspur", "Mehrana"],
                "BAUND": ["Achina", "Bas Ranila", "Baund Kalan", "Baund Khurd", "Hindol", "Sanjarwas", "Sankrod", "Gharethi", "Ranila"]
            },
            "BADHRA SUB-DIVISION": {
                "BADHRA": ["Badhra", "Mandola", "Kallana", "Chappar", "Jhojhu Khurd", "Kheri Bura", "Kadma", "Ghuiyani", "Lawa", "Hansiwas"]
            }
        },
        "ROHTAK": {
            "ROHTAK SUB-DIVISION": {
                "ROHTAK": ["Rohtak Rural", "Bhalout", "Kharawar", "Kheri Sadh", "Bohar", "Asthal Bohar", "Paharipur", "Sunaria Kalan", "Sunaria Khurd", "Makrauli Kalan"]
            },
            "SAMPLA SUB-DIVISION": {
                "SAMPLA": ["Sampla", "Ismaila 11B", "Ismaila 9B", "Kultana", "Dattaur", "Atail", "Gandhra", "Bhadhadu", "Balku", "Ghashi", "Rohad", "Kheri Sampla", "Gijhi", "Naya Bans", "Chandi", "Nonand"]
            },
            "MEHAM SUB-DIVISION": {
                "MEHAM": ["Meham", "Farmana", "Semnan", "Madina Gindhran", "Madina Korsan", "Mokhra Khas", "Mokhra Bahi", "Baini City", "Sarsa", "Nidana"],
                "LAKHAN MAJRA": ["Lakhan Majra", "Chandi", "Nandwal", "Gharawathi", "Kharak Jattan", "Indergarh", "Titian", "Brahmanwas"]
            },
            "KALANAUR SUB-DIVISION": {
                "KALANAUR": ["Kalanaur", "Kahnaur", "Anwal", "Nigana", "Kairi", "Katesara", "Jindran", "Gudhan", "Masudpur"]
            }
        },
        "JHAJJAR": {
            "JHAJJAR SUB-DIVISION": {
                "JHAJJAR": ["Jhajjar Rural", "Silani", "Kutani", "Gudha", "Giani", "Bhurawas", "Kheri Khummar", "Suhra", "Dhani", "Talao"]
            },
            "BAHADURGARH SUB-DIVISION": {
                "BAHADURGARH": ["Bahadurgarh Rural", "Asaudha Todran", "Asaudha Siwan", "Barahi", "Bamnoli", "Sankhol", "Sidhipur Lova", "Rohad", "Daboda Kalan", "Daboda Khurd", "Kanonda", "Soldha", "Jasaur Kheri"]
            },
            "BERI SUB-DIVISION": {
                "BERI": ["Beri", "Dighal", "Baghpur", "Dubaldhan", "Chhara", "Gochhi", "Majra", "Wazirpur", "Bisahan", "Gangtan"]
            },
            "BADLI SUB-DIVISION": {
                "BADLI": ["Badli", "Bupania", "Pelpa", "Dulhera", "Munimpur", "Yakubpur", "Gubhana", "Majri", "Pahori"]
            }
        }
    };

    // Load Districts
    window.onload = function() {
        let dist = document.getElementById('distSelect');
        for (let d in db) {
            let opt = document.createElement('option');
            opt.value = d;
            opt.innerText = d;
            dist.appendChild(opt);
        }
    };

    function loadAreas() {
        let d = document.getElementById('distSelect').value;
        let area = document.getElementById('areaSelect');
        document.getElementById('blockSelect').innerHTML = '<option value="">-- पहले एरिया चुनें --</option>';
        document.getElementById('villageSelect').innerHTML = '<option value="">-- पहले ब्लॉक चुनें --</option>';
        area.innerHTML = '<option value="">-- एरिया (Sub-Division) चुनें --</option>';

        if (d && db[d]) {
            for (let a in db[d]) {
                let opt = document.createElement('option');
                opt.value = a;
                opt.innerText = a;
                area.appendChild(opt);
            }
        }
    }

    function loadBlocks() {
        let d = document.getElementById('distSelect').value;
        let a = document.getElementById('areaSelect').value;
        let block = document.getElementById('blockSelect');
        document.getElementById('villageSelect').innerHTML = '<option value="">-- पहले ब्लॉक चुनें --</option>';
        block.innerHTML = '<option value="">-- खण्ड / Block चुनें --</option>';

        if (d && a && db[d][a]) {
            for (let b in db[d][a]) {
                let opt = document.createElement('option');
                opt.value = b;
                opt.innerText = b;
                block.appendChild(opt);
            }
        }
    }

    function loadVillages() {
        let d = document.getElementById('distSelect').value;
        let a = document.getElementById('areaSelect').value;
        let b = document.getElementById('blockSelect').value;
        let village = document.getElementById('villageSelect');
        village.innerHTML = '<option value="">-- गाँव / Village चुनें --</option>';

        if (d && a && b && db[d][a][b]) {
            db[d][a][b].forEach(v => {
                let opt = document.createElement('option');
                opt.value = v;
                opt.innerText = v;
                village.appendChild(opt);
            });
        }
    }

    function showData() {
        let d = document.getElementById('distSelect').value;
        let a = document.getElementById('areaSelect').value;
        let b = document.getElementById('blockSelect').value;
        let v = document.getElementById('villageSelect').value;

        if (!d || !a || !b || !v) {
            alert('कृपया चारों विकल्प चुनें!');
            return;
        }

        let res = document.getElementById('resultBox');
        res.style.display = 'block';
        res.innerHTML = `<strong>📍 चुना गया लोकेशन:</strong><br>जिला: ${d}<br>एरिया: ${a}<br>ब्लॉक: ${b}<br>गाँव: ${v}`;
    }
</script>

</body>
</html>
