<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>District Block Village Dropdown</title>
  <style>
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    select {
      width: 100%;
      max-width: 300px;
      padding: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>Apna Pata Chunein (Select Address)</h2>

  <!-- 1. District Dropdown -->
  <div class="form-group">
    <label for="district">District (Zila):</label>
    <select id="district" onchange="loadBlocks()">
      <option value="">-- Select District --</option>
      <option value="rohtak">Rohtak</option>
      <option value="jhajjar">Jhajjar</option>
    </select>
  </div>

  <!-- 2. Block Dropdown -->
  <div class="form-group">
    <label for="block">Block:</label>
    <select id="block" onchange="loadVillages()" disabled>
      <option value="">-- Select Block First --</option>
    </select>
  </div>

  <!-- 3. Village Dropdown -->
  <div class="form-group">
    <label for="village">Village (Gaon):</label>
    <select id="village" disabled>
      <option value="">-- Select Village First --</option>
    </select>
  </div>

  <script>
    // Data Structure (District -> Block -> Village)
    const addressData = {
      "rohtak": {
        "sampla": ["Sampla Gaon", "Ismaila", "Kharawar", "Gandal"],
        "kalanaur": ["Kalanaur Gaon", "Khentawas", "Anwal"]
      },
      "jhajjar": {
        "bahadurgarh": ["Sankhol", "Bamdoli", "Rohad"],
        "berli": ["Berli Khurd", "Berli Kalan"]
      }
    };

    // Block Load Karne Ka Function
    function loadBlocks() {
      const districtSelect = document.getElementById("district");
      const blockSelect = document.getElementById("block");
      const villageSelect = document.getElementById("village");

      const selectedDistrict = districtSelect.value;

      // Reset Block and Village
      blockSelect.innerHTML = '<option value="">-- Select Block --</option>';
      villageSelect.innerHTML = '<option value="">-- Select Village First --</option>';
      villageSelect.disabled = true;

      if (selectedDistrict && addressData[selectedDistrict]) {
        blockSelect.disabled = false;
        const blocks = Object.keys(addressData[selectedDistrict]);
        
        blocks.forEach(block => {
          const option = document.createElement("option");
          option.value = block;
          option.textContent = block.charAt(0).toUpperCase() + block.slice(1);
          blockSelect.appendChild(option);
        });
      } else {
        blockSelect.disabled = true;
      }
    }

    // Village Load Karne Ka Function
    function loadVillages() {
      const districtSelect = document.getElementById("district");
      const blockSelect = document.getElementById("block");
      const villageSelect = document.getElementById("village");

      const selectedDistrict = districtSelect.value;
      const selectedBlock = blockSelect.value;

      // Reset Village
      villageSelect.innerHTML = '<option value="">-- Select Village --</option>';

      if (selectedDistrict && selectedBlock && addressData[selectedDistrict][selectedBlock]) {
        villageSelect.disabled = false;
        const villages = addressData[selectedDistrict][selectedBlock];

        villages.forEach(village => {
          const option = document.createElement("option");
          option.value = village.toLowerCase().replace(/\s+/g, '-');
          option.textContent = village;
          villageSelect.appendChild(option);
        });
      } else {
        villageSelect.disabled = true;
      }
    }
  </script>

</body>
</html>
