<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हरियाणा ग्रामीण सेवा - डिजिटल ग्राम पोर्टल</title>
    <style>
        :root {
            --primary: #1b5e20;
            --secondary: #ff8f00;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #2e7d32);
            color: white;
            padding: 20px 15px;
            text-align: center;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
        }

        .card h2 {
            font-size: 1.1rem;
            color: #ffffff;
            background: #3f51b5;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #b0bec5;
            border-radius: 6px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
        }

        .custom-btn {
            display: block;
            width: 100%;
            background: #3f51b5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .custom-btn:hover { background: #303f9f; }

        .shop-item {
            background: #f9f9f9;
            border-left: 4px solid var(--primary);
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body onload="initDistricts()">

        <p>समस्त गाँवों की विस्तृत सूची (भिवानी, रोहतक, हिसार, चरखी दादरी, महेंद्रगढ़)</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>अपना जिला, ब्लॉक और गाँव चुनें</h2>
            
            <div class="form-group">
                <label>जिला / District *</label>
                <select id="mainDistrictSelect" onchange="loadBlocks()">
                    <option value="">-- जिला चुनें --</option>
                </select>
            </div>

            <div class="form-group">
                <label>खण्ड / Block *</label>
                <select id="mainBlockSelect" onchange="loadVillages()">
                    <option value="">-- पहले जिला चुनें --</option>
                </select>
            </div>

            <div class="form-group">
                <label>गाँव / Village चुनें या खोजें *</label>
                <input type="text" id="mainVillageInput" list="villageListOptions" placeholder="गाँव का नाम यहाँ लिखें...">
                <datalist id="villageListOptions">
                </datalist>
            </div>

            <button class="custom-btn" onclick="showVillageDetails()">विवरण देखें</button>

            <div id="searchResult" style="margin-top: 15px;"></div>

    </div>

        function initDistricts() {
            const distSelect = document.getElementById("mainDistrictSelect");
            distSelect.innerHTML = '<option value="">-- जिला चुनें --</option>';
            
            Object.keys(haryanaData).sort().forEach(dist => {
                distSelect.innerHTML += `<option value="${dist}">${dist}</option>`;
            });
        }

        function loadBlocks() {
            const dist = document.getElementById("mainDistrictSelect").value;
            const blockSelect = document.getElementById("mainBlockSelect");
            const villageInput = document.getElementById("mainVillageInput");
            const villageList = document.getElementById("villageListOptions");

            blockSelect.innerHTML = '<option value="">-- ब्लॉक चुनें --</option>';
            villageInput.value = "";
            villageList.innerHTML = "";

            if (dist && haryanaData[dist]) {
                Object.keys(haryanaData[dist]).sort().forEach(block => {
                    blockSelect.innerHTML += `<option value="${block}">${block}</option>`;
                });
            }
        }

        function loadVillages() {
            const dist = document.getElementById("mainDistrictSelect").value;
            const block = document.getElementById("mainBlockSelect").value;
            const villageList = document.getElementById("villageListOptions");
            const villageInput = document.getElementById("mainVillageInput");

            villageInput.value = "";
            villageList.innerHTML = "";

            if (dist && block && haryanaData[dist][block]) {
                haryanaData[dist][block].sort().forEach(village => {
                    villageList.innerHTML += `<option value="${village}">`;
                });
            }
        }

        function showVillageDetails() {
            const dist = document.getElementById("mainDistrictSelect").value;
            const block = document.getElementById("mainBlockSelect").value;
            const village = document.getElementById("mainVillageInput").value;
            const resultBox = document.getElementById("searchResult");

            if (!dist || !block || !village) {
                resultBox.innerHTML = `<p style="color: red; font-weight: bold; font-size: 0.9rem;">कृपया जिला, ब्लॉक और गाँव का नाम सही से भरें!</p>`;
                return;
            }

            resultBox.innerHTML = `
                <div class="shop-item">
                    <h4 style="color: var(--primary);">चयनित स्थान की जानकारी:</h4>
                    <p style="font-size: 0.9rem; margin-top: 5px;">📍 <b>गाँव:</b> ${village}</p>
                    <p style="font-size: 0.9rem;">🏢 <b>ब्लॉक:</b> ${block}</p>
                    <p style="font-size: 0.9rem;">🏛️ <b>जिला:</b> ${dist}</p>
                    <span style="display:inline-block; margin-top:8px; background:#e8f5e9; color:#2e7d32; padding:3px 8px; border-radius:4px; font-size:0.8rem; font-weight:bold;">✔ संपूर्ण डेटा लोड सफल</span>
