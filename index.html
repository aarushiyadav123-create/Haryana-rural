<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा गाँव - संपूर्ण हरियाणा ग्रामीण सेवा</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f6f9; padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 550px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
        h2 { color: #1b5e20; text-align: center; margin-bottom: 20px; font-size: 1.4rem; }
        .form-group { margin-bottom: 18px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.95rem; }
        select { width: 100%; padding: 12px; border: 1px solid #b0bec5; border-radius: 8px; font-size: 1rem; outline: none; background: #fff; cursor: pointer; }
        select:focus { border-color: #1b5e20; }
        .btn { background: #1b5e20; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #113f14; }
        .loader { font-size: 0.85rem; color: #d84315; font-weight: bold; display: none; margin-top: 5px; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #e8f5e9; border: 1px solid #a5d6a7; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌾 MeraGaov - Haryana Full 7000+ Villages</h2>

    <!-- 1. District -->
    <div class="form-group">
        <label>1. जिला चुनें (District):</label>
        <select id="districtSelect" onchange="loadBlocks()">
            <option value="">-- डेटा लोड हो रहा है... --</option>
        </select>
    </div>

    <!-- 2. Block -->
    <div class="form-group">
        <label>2. खण्ड चुनें (Block):</label>
        <select id="blockSelect" onchange="loadVillages()">
            <option value="">-- पहले जिला चुनें --</option>
        </select>
    </div>

    <!-- 3. Village -->
    <div class="form-group">
        <label>3. गाँव चुनें (Village):</label>
        <select id="villageSelect">
            <option value="">-- पहले ब्लॉक चुनें --</option>
        </select>
        <div id="loadingStatus" class="loader">⌛ सभी गाँव लोड हो रहे हैं...</div>
    </div>

    <button class="btn" onclick="showData()">विवरण देखें (View Details)</button>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    let fullHaryanaData = {};

    // Load Complete Official Haryana Village Master Data File
    window.onload = async function() {
        let distSelect = document.getElementById('districtSelect');
        
        try {
            // High-Speed Reliable Raw Data Source for ALL Haryana Villages
            let response = await fetch('https://raw.githubusercontent.com/sabir-developer/india-location-data/main/states/haryana.json');
            
            if(!response.ok) {
                // Fallback secondary source
                response = await fetch('https://cdn.jsdelivr.net/gh/sabir-developer/india-location-data@main/states/haryana.json');
            }
            
            fullHaryanaData = await response.json();

            distSelect.innerHTML = '<option value="">-- जिला चुनें --</option>';
            for (let district in fullHaryanaData) {
                let opt = document.createElement('option');
                opt.value = district;
                opt.innerText = district;
                distSelect.appendChild(opt);
            }
        } catch (error) {
            distSelect.innerHTML = '<option value="">-- डेटा लोड नहीं हो सका (पेज रिफ्रेश करें) --</option>';
        }
    };

    function loadBlocks() {
        let dist = document.getElementById('districtSelect').value;
        let blockSelect = document.getElementById('blockSelect');
        let villageSelect = document.getElementById('villageSelect');

        blockSelect.innerHTML = '<option value="">-- खण्ड / Block चुनें --</option>';
        villageSelect.innerHTML = '<option value="">-- पहले ब्लॉक चुनें --</option>';

        if (dist && fullHaryanaData[dist]) {
            for (let block in fullHaryanaData[dist]) {
                let opt = document.createElement('option');
                opt.value = block;
                opt.innerText = block;
                blockSelect.appendChild(opt);
            }
        }
    }

    function loadVillages() {
        let dist = document.getElementById('districtSelect').value;
        let block = document.getElementById('blockSelect').value;
        let villageSelect = document.getElementById('villageSelect');

        villageSelect.innerHTML = '<option value="">-- गाँव चुनें --</option>';

        if (dist && block && fullHaryanaData[dist][block]) {
            let villages = fullHaryanaData[dist][block];
            
            // Alphabetical Sort
            villages.sort();

            villages.forEach(v => {
                let opt = document.createElement('option');
                opt.value = v;
                opt.innerText = v;
                villageSelect.appendChild(opt);
            });
        }
    }

    function showData() {
        let d = document.getElementById('districtSelect').value;
        let b = document.getElementById('blockSelect').value;
        let v = document.getElementById('villageSelect').value;

        if (!d || !b || !v) {
            alert('कृपया जिला, ब्लॉक और गाँव तीनों चुनें!');
            return;
        }

        let resBox = document.getElementById('resultBox');
        resBox.style.display = 'block';
        resBox.innerHTML = `<strong>📍 चयनित स्थान:</strong><br>जिला: ${d}<br>ब्लॉक: ${b}<br>गाँव: ${v}`;
    }
</script>

</body>
</html>
