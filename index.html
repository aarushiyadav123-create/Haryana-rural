<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हरियाणा ग्रामीण सेवा</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        header { background-color: #2e7d32; color: white; padding: 15px; text-align: center; position: relative; }
        header h1 { margin: 0; font-size: 1.5rem; }
        
        /* प्लस बटन */
        .menu-btn {
            position: absolute; right: 15px; top: 15px;
            background: #ffeb3b; color: #2e7d32; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 24px; font-weight: bold; cursor: pointer;
        }

        /* ड्रॉपडाउन (जो "+" के अंदर है) */
        .dropdown {
            display: none; background: white; border: 1px solid #ddd;
            position: absolute; right: 10px; top: 60px;
            width: 200px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 100;
        }
        .dropdown a {
            display: block; padding: 12px; border-bottom: 1px solid #eee;
            text-decoration: none; color: #333; font-weight: bold;
        }

        .container { padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .btn-main { background: #1b5e20; color: white; width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>हरियाणा ग्रामीण सेवा</h1>
    <button class="menu-btn" onclick="toggleMenu()">+</button>
</header>

<!-- प्लस बटन के अंदर के ऑप्शन -->
<div id="menu" class="dropdown">
    <a href="#" onclick="actionAlert('Add Shop')">➕ Add Shop</a>
    <a href="#" onclick="actionAlert('Govt Schemes')">📜 Govt Schemes</a>
    <a href="#" onclick="actionAlert('Nearby Search')">📍 My Nearby</a>
    <a href="#" onclick="actionAlert('Entertainment')">🎭 मनोरंजन</a>
    <a href="#" onclick="adminLogin()">🔒 Admin Login</a>
</div>

<div class="container">
    <div class="box">
        <label>जिला चुनें:</label>
        <select id="district" onchange="loadVillages()">
            <option value="">-- जिला --</option>
            <option value="mahendragarh">महेंद्रगढ़</option>
            <option value="rewari">रेवाड़ी</option>
        </select>

        <label>गाँव चुनें:</label>
        <select id="village">
            <option value="">-- पहले जिला चुनें --</option>
        </select>
        
        <button class="btn-main" onclick="alert('दुकानें खुल रही हैं...')">दुकानें देखें</button>
    </div>
</div>

<script>
    function toggleMenu() {
        let m = document.getElementById('menu');
        m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    }

    function actionAlert(feature) {
        toggleMenu(); // मेनू बंद कर दे
        alert(feature + " जल्द ही अपडेट होगा!");
    }

    function adminLogin() {
        toggleMenu();
        let pass = prompt("Admin Password:");
        if (pass === "sub123") alert("Welcome Admin!");
    }

    function loadVillages() {
        // गाँव लोड करने का कोड
    }
</script>

</body>
</html>
