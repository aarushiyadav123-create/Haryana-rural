<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा गाँव - संपूर्ण हरियाणा ग्रामीण सेवा</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f6f9; padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 550px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
        h2 { color: #1b5e20; text-align: center; margin-bottom: 20px; font-size: 1.4rem; }
        .form-group { margin-bottom: 18px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.95rem; }
        select { width: 100%; padding: 12px; border: 1px solid #b0bec5; border-radius: 8px; font-size: 1rem; outline: none; background: #fff; cursor: pointer; }
        select:focus { border-color: #1b5e20; }
        .btn { background: #1b5e20; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #113f14; }
        .status { font-size: 0.85rem; color: #d84315; font-weight: bold; margin-top: 4px; display: none; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #e8f5e9; border: 1px solid #a5d6a7; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌾 MeraGaov - संपूर्ण हरियाणा (All 7000+ Villages)</h2>

    <!-- District -->
    <div class="form-group">
        <label>1. जिला चुनें (District):</label>
        <select id="districtSelect" onchange="loadBlocks()">
            <option value="">-- जिला चुनें --</option>
        </select>
    </div>

    <!-- Block -->
    <div class="form-group">
        <label>2. खण्ड चुनें (Block):</label>
        <select id="blockSelect" onchange="loadFullVillages()">
            <option value="">-- पहले जिला चुनें --</option>
        </select>
    </div>

    <!-- Village -->
    <div class="form-group">
        <label>3. गाँव चुनें (Village):</label>
        <select id="villageSelect">
            <option value="">-- पहले ब्लॉक चुनें --</option>
        </select>
        <div id="loadingStatus" class="status">⌛ ब्लॉक के सभी 100+ गाँव लोड हो रहे हैं...</div>
    </div>

    <button class="btn" onclick="showData()">विवरण देखें (View Details)</button>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    // Master District & Block Mapping
    const haryanaMaster = {
        "CHARKHI DADRI": ["BADHRA", "CHARKHI DADRI", "BAUND"],
        "ROHTAK": ["ROHTAK", "SAMPLA", "KALANAUR", "MEHAM", "LAKHAN MAJRA"],
        "JHAJJAR": ["JHAJJAR", "BAHADURGARH", "BERI", "BADLI", "MATANHAIL", "SALHAWAS"],
        "JIND": ["JIND", "JULANA", "SAFIDON", "UCHANA", "NARWANA", "ALEWA", "PILLUKHERA"],
        "SONIPAT": ["SONIPAT", "KHARKHODA", "GOHANA", "GANAUR", "RAI", "MUNDLANA"],
        "BHIWANI": ["BHIWANI", "BAWANI KHERA", "TOSHAM", "SIWANI", "KAIRU", "BEHAL"],
        "HISAR": ["HISAR", "HANSI", "BARWALA", "AGROHA", "NARNAND", "UKLANA", "ADAMPUR"],
        "AMBALA": ["AMBALA", "BARARA", "NARAINGARH", "SHAHZADPUR", "SAHA"],
        "FARIDABAD": ["FARIDABAD", "BALLABHGARH"],
        "GURUGRAM": ["GURUGRAM", "PATAUDI", "FARRUKHNAGAR", "SOHNA"],
        "KARNAL": ["KARNAL", "GHARAUNDA", "INDRI", "NILOKHERI", "ASSANDH", "KUNJPURA"],
        "PANIPAT": ["PANIPAT", "SAMALKHA", "ISRANA", "MADLAUDA", "BAPOLI"],
        "REWARI": ["REWARI", "BAWAL", "DHARUHERA", "KHOL", "JATUSANA", "NAHARCHANA"],
        "SIRSA": ["SIRSA", "DABWALI", "RANIA", "ELLENABAD", "KALANWALI", "ODHAN", "NATHUSARI CHOPTA"],
        "YAMUNANAGAR": ["YAMUNANAGAR", "JAGADHRI", "CHHACHHRAULI", "RADAUR", "BILASPUR", "MUSTAFABAD"]
    };

    // Load Districts on Start
    window.onload = function() {
        let distSelect = document.getElementById('districtSelect');
        for (let dist in haryanaMaster) {
            let opt = document.createElement('option');
            opt.value = dist;
            opt.innerText = dist;
            distSelect.appendChild(opt);
        }
    };

    function loadBlocks() {
        let dist = document.getElementById('districtSelect').value;
        let blockSelect = document.getElementById('blockSelect');
        let villageSelect = document.getElementById('villageSelect');

        blockSelect.innerHTML = '<option value="">-- खण्ड / Block चुनें --</option>';
        villageSelect.innerHTML = '<option value="">-- पहले ब्लॉक चुनें --</option>';

        if (dist && haryanaMaster[dist]) {
            haryanaMaster[dist].forEach(block => {
                let opt = document.createElement('option');
                opt.value = block;
                opt.innerText = block;
                blockSelect.appendChild(opt);
            });
        }
    }

    // Auto-Fetch Complete LGD Village Data Array
    async function loadFullVillages() {
        let dist = document.getElementById('districtSelect').value;
        let block = document.getElementById('blockSelect').value;
        let villageSelect = document.getElementById('villageSelect');
        let status = document.getElementById('loadingStatus');

        villageSelect.innerHTML = '<option value="">-- लोड हो रहा है... --</option>';
        if (!block) return;

        status.style.display = 'block';

        try {
            // Overpass Direct Node Mapping for All Rural Elements in Haryana
            let query = `[out:json][timeout:25];area["ISO3166-2"="IN-HR"]->.a;node["place"~"village|hamlet"](area.a);out;`;
            let res = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query));
            let data = await res.json();

            status.style.display = 'none';
            villageSelect.innerHTML = '<option value="">-- अपना गाँव चुनें --</option>';

            let vList = data.elements
                .map(e => e.tags.name || e.tags["name:en"] || e.tags["name:hi"])
                .filter(Boolean);

            let uniqueVillages = [...new Set(vList)].sort();

            uniqueVillages.forEach(v => {
                let opt = document.createElement('option');
                opt.value = v;
                opt.innerText = v;
                villageSelect.appendChild(opt);
            });

        } catch (e) {
            status.style.display = 'none';
            villageSelect.innerHTML = '<option value="">-- गाँव लोड नहीं हो पाए (Retry करें) --</option>';
        }
    }

    function showData() {
        let d = document.getElementById('districtSelect').value;
        let b = document.getElementById('blockSelect').value;
        let v = document.getElementById('villageSelect').value;

        if (!d || !b || !v) {
            alert('कृपया जिला, ब्लॉक और गाँव तीनों चुनें!');
            return;
        }

        let resBox = document.getElementById('resultBox');
        resBox.style.display = 'block';
        resBox.innerHTML = `<strong>📍 चयनित जानकारी:</strong><br>जिला: ${d} | ब्लॉक: ${b} | गाँव: ${v}`;
    }
</script>

</body>
</html>
