<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>हरियाणा ग्रामीण सेवा Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 30px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #1b5e20;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 15px;
      background-color: #fff;
    }
    select:disabled {
      background-color: #e9ecef;
      cursor: not-allowed;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #1b5e20;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #144417;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>हरियाणा ग्रामीण सेवा - स्थान चयन</h2>

  <!-- 1. District Dropdown -->
  <div class="form-group">
    <label for="district">1. ज़िला (District):</label>
    <select id="district" onchange="onDistrictChange()">
      <option value="">-- ज़िला चुनें --</option>
    </select>
  </div>

  <!-- 2. Block Dropdown -->
  <div class="form-group">
    <label for="block">2. ब्लॉक/तहसील (Block/Tehsil):</label>
    <select id="block" onchange="onBlockChange()" disabled>
      <option value="">-- पहले ज़िला चुनें --</option>
    </select>
  </div>

  <!-- 3. Village Dropdown -->
  <div class="form-group">
    <label for="village">3. गाँव (Village):</label>
    <select id="village" disabled>
      <option value="">-- पहले ब्लॉक चुनें --</option>
    </select>
  </div>

  <button onclick="submitData()">सबमिट करें (Submit)</button>
</div>

  // 1. ज़िला ड्रॉपडाउन लोड करना
  window.onload = function() {
    const districtSelect = document.getElementById("district");
    for (let dist in haryanaFullData) {
      let opt = document.createElement("option");
      opt.value = dist;
      opt.textContent = dist;
      districtSelect.appendChild(opt);
    }
  };

  // 2. ज़िला सेलेक्ट करने पर ब्लॉक बदलना
  function onDistrictChange() {
    const distSelect = document.getElementById("district");
    const blockSelect = document.getElementById("block");
    const villageSelect = document.getElementById("village");

    const selDist = distSelect.value;

    blockSelect.innerHTML = '<option value="">-- ब्लॉक/तहसील चुनें --</option>';
    villageSelect.innerHTML = '<option value="">-- पहले ब्लॉक चुनें --</option>';
    villageSelect.disabled = true;

    if (selDist && haryanaFullData[selDist]) {
      blockSelect.disabled = false;
      for (let blk in haryanaFullData[selDist]) {
        let opt = document.createElement("option");
        opt.value = blk;
        opt.textContent = blk;
        blockSelect.appendChild(opt);
      }
    } else {
      blockSelect.disabled = true;
    }
  }

  // 3. ब्लॉक सेलेक्ट करने पर गाँव लोड होना
  function onBlockChange() {
    const distSelect = document.getElementById("district");
    const blockSelect = document.getElementById("block");
    const villageSelect = document.getElementById("village");

    const selDist = distSelect.value;
    const selBlk = blockSelect.value;

    villageSelect.innerHTML = '<option value="">-- गाँव चुनें --</option>';

    if (selDist && selBlk && haryanaFullData[selDist][selBlk]) {
      villageSelect.disabled = false;
      const vList = haryanaFullData[selDist][selBlk];
      vList.forEach(function(v) {
        let opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        villageSelect.appendChild(opt);
      });
    } else {
      villageSelect.disabled = true;
    }
  }

  function submitData() {
    const d = document.getElementById("district").value;
    const b = document.getElementById("block").value;
    const v = document.getElementById("village").value;

    if (!d || !b || !v) {
      alert("कृपया ज़िला, ब्लॉक और गाँव तीनों चुनें!");
    } else {
      alert(`सफलतापूर्वक चुना गया:\n\nज़िला: ${d}\nब्लॉक: ${b}\nगाँव: ${v}`);
    }
  }
