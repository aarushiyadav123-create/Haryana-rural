<!DOCTYPE html>
<html lang="hi" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">हरियाणा ग्रामीण सेवा - डिजिटल ग्राम पोर्टल</title>
    <style>
        :root { --primary: #1b5e20; --secondary: #ff8f00; --bg-color: #f4f6f9; --card-bg: #ffffff; --text-color: #333; --news-bg: #fff3e0; --news-text: #e65100; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 50px; }
        
        .top-bar { background: #113f14; color: #ffeb3b; font-size: 13px; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; }
        .lang-btn { background: #ffc107; color: #000; border: none; padding: 5px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        header { background: linear-gradient(135deg, var(--primary), #2e7d32); color: white; padding: 20px 15px; text-align: center; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .news-container { background: var(--news-bg); padding: 10px; border-radius: 6px; margin-bottom: 20px; border-left: 5px solid var(--secondary); }
        
        label { display: block; font-weight: 600; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; }
        .custom-btn { width: 100%; background: var(--primary); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #d32f2f; color: white; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>👨‍💼 संस्थापक: राजेश यादव (माल्कोश)</span>
        <button class="lang-btn" onclick="toggleLanguage()">English / हिंदी</button>
    </div>

    <header>
        <h1 id="mainHeader">हरियाणा ग्रामीण सेवा</h1>
    </header>

    <div class="container">
        <!-- लाइव न्यूज़ (सिर्फ खबर) -->
        <div class="news-container">
            <marquee id="newsMarqueeText">मंडी भाव: गेहूँ ₹2275, बाजरा ₹2500, सरसों ₹5400 क्विंटल। | मौसम: आज आसमान साफ रहेगा, तापमान 34°C।</marquee>
        </div>

        <!-- सर्च सेक्शन -->
        <div class="card">
            <h2>🔍 अपने गाँव की सेवाएँ खोजें</h2>
            <label>1. जिला चुनें:</label>
            <select id="districtSelect" onchange="updateVillages()">
                <option value="">-- जिला चुनें --</option>
                <option value="rohtak">रोहतक</option>
                <option value="bhiwani">भिवानी</option>
                <option value="hisar">हिसार</option>
                <option value="charkhi_dadri">चरखी दादरी</option>
            </select>

            <label>2. गाँव चुनें:</label>
            <select id="villageSelect"><option value="">-- जिला चुनें --</option></select>

            <label>3. गाँव का नाम टाइप करें:</label>
            <input type="text" id="manualVillageInput" placeholder="नाम लिखें...">
            <button class="custom-btn" onclick="searchServices()">दुकानें देखें</button>
            <div id="searchResult" style="margin-top:15px;"></div>
        </div>

        <!-- रजिस्टर सेक्शन -->
        <div class="card">
            <h2>📝 दुकान रजिस्टर करें</h2>
            <input type="text" id="regShopName" placeholder="दुकान का नाम">
            <input type="text" id="regVillage" placeholder="गाँव का नाम">
            <select id="regCategory">
                <option>किराना स्टोर</option><option>मेडिकल</option><option>इलेक्ट्रॉनिक्स</option>
            </select>
            <input type="tel" id="regPhone" placeholder="मोबाइल नंबर">
            <button class="custom-btn" onclick="registerService()">➕ दुकान रजिस्टर करें</button>
        </div>

        <!-- एडमिन -->
        <div class="card">
            <button class="custom-btn" style="background:#ff8f00" onclick="document.getElementById('adminPanel').style.display='block'">🔒 एडमिन वेरिफिकेशन</button>
            <div id="adminPanel" style="display:none; margin-top:15px;">
                <input type="password" id="adminPass" placeholder="पासवर्ड (admin123)">
                <button class="custom-btn" onclick="verifyAdmin()">लॉगिन</button>
                <div id="adminControls" style="display:none;">
                    <h4>पेंडिंग:</h4>
                    <div id="pendingList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let customVillages = JSON.parse(localStorage.getItem('addedVillages') || '[]');

        function updateVillages() {
            const district = document.getElementById('districtSelect').value;
            const villageSelect = document.getElementById('villageSelect');
            villageSelect.innerHTML = '<option value="">-- गाँव चुनें --</option>';
            
            // डिफ़ॉल्ट गाँव लोड करें (यहाँ आप और भी जोड़ सकते हैं)
            const defaultVillages = ["गोपी", "इस्मला", "बाढड़ा"]; 
            defaultVillages.forEach(v => {
                let opt = document.createElement('option'); opt.value = v; opt.textContent = v;
                villageSelect.appendChild(opt);
            });

            // नए जोड़े गए गाँव दिखाएं
            customVillages.forEach(v => {
                let opt = document.createElement('option'); opt.value = v; opt.textContent = v;
                villageSelect.appendChild(opt);
            });
        }

        function registerService() {
            const name = document.getElementById('regShopName').value;
            const village = document.getElementById('regVillage').value;
            const phone = document.getElementById('regPhone').value;
            
            let pending = JSON.parse(localStorage.getItem('pendingShops') || '[]');
            pending.push({ name, village, phone });
            localStorage.setItem('pendingShops', JSON.stringify(pending));
            alert('सफलता! एडमिन वेरिफिकेशन के बाद जुड़ जाएगा।');
        }

        function verifyAdmin() {
            if(document.getElementById('adminPass').value === 'admin123') {
                document.getElementById('adminControls').style.display = 'block';
                loadPending();
            } else alert('गलत पासवर्ड');
        }

        function loadPending() {
            let list = document.getElementById('pendingList');
            let pending = JSON.parse(localStorage.getItem('pendingShops') || '[]');
            list.innerHTML = '';
            pending.forEach((s, index) => {
                list.innerHTML += `<div>${s.name} (${s.village}) <button onclick="approve(${index})">✔</button></div>`;
            });
        }

        function approve(index) {
            let pending = JSON.parse(localStorage.getItem('pendingShops') || '[]');
            let approved = JSON.parse(localStorage.getItem('approvedShops') || '[]');
            let shop = pending.splice(index, 1)[0];
            approved.push(shop);
            
            // गाँव को ऑटो-ऐड करें
            if(!customVillages.includes(shop.village)) {
                customVillages.push(shop.village);
                localStorage.setItem('addedVillages', JSON.stringify(customVillages));
            }

            localStorage.setItem('pendingShops', JSON.stringify(pending));
            localStorage.setItem('approvedShops', JSON.stringify(approved));
            alert('सत्यापित! गाँव अब सर्च में आ जाएगा।');
            location.reload();
        }

        // लोड होते ही ड्रॉपडाउन अपडेट करें
        updateVillages();
    </script>
</body>
</html>
