<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हरियाणा ग्रामीण सेवा - डिजिटल ग्राम पोर्टल</title>
    <style>
        :root { --primary: #1b5e20; --secondary: #2e7d32; --accent: #f57c00; --bg: #f4f6f8; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .top-bar { background: #0d3b10; color: #fff; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .top-nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 3px 8px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 11px; }
        header { background: linear-gradient(135deg, #1b5e20, #2e7d32); color: white; text-align: center; padding: 15px 10px; }
        header h1 { margin: 0; font-size: 1.3rem; }
        header p { margin: 4px 0 0; font-size: 0.8rem; opacity: 0.9; }
        .badge { background: #ffb300; color: #000; display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; margin-top: 6px; }
        .container { max-width: 600px; margin: 10px auto; padding: 10px; }
        .card { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 12px; }
        .card h2 { font-size: 1.05rem; color: var(--primary); margin-top: 0; border-bottom: 2px solid #e8f5e9; padding-bottom: 6px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; color: #444; }
        .mandatory { color: red; }
        select, input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        .custom-btn { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .custom-btn:hover { background: #144517; }
        .toggle-bar { background: var(--primary); color: white; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .toggle-bar.orange { background: #e65100; }
        .toggle-bar.red { background: #c62828; }
        .toggle-bar.govt { background: #01579b; }
        .collapsible-form-container { display: none; background: white; padding: 12px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 12px; }
        .photo-preview-box { width: 100%; height: 120px; border: 2px dashed #ccc; border-radius: 6px; display: flex; align-items: center; justify-content: center; margin-top: 6px; overflow: hidden; background: #fafafa; }
        .photo-preview-box img { max-width: 100%; max-height: 100%; display: none; }
        footer { text-align: center; padding: 10px; font-size: 0.75rem; color: #666; }
    </style>
</head>
<body onload="initPortal()">

    <div class="top-bar">
        <span>👩‍💼 संस्थापक: कुसुम w/o राजेश यादव</span>
        <div style="display: flex; gap: 5px;">
            <a href="#searchSection" class="top-nav-btn">गाँव खोजें</a>
            <button class="top-nav-btn" onclick="toggleSection('addShopFormBox', 'icon1')">Admin/Shop</button>
        </div>
    </div>

    <header>
        <h1 id="headerTitle">मेरा गाँव - हरियाणा ग्रामीण सेवा</h1>
        <p>डिजिटल ग्राम पोर्टल व स्थानीय बाज़ार सेवाएं</p>
        <div class="badge" id="currentLocationBadge">📍 हरियाणा के सभी ज़िले सक्रिय</div>
    </header>

    <div class="container" id="searchSection">

        <!-- SEARCH SECTION -->
        <div class="card">
            <h2>अपना गाँव व दुकान खोजें</h2>
            <div class="form-group">
                <label>जिला / District <span class="mandatory">*</span></label>
                <select id="mainDistrictSelect" onchange="onMainDistrictChange()">
                    <option value="">-- जिला चुनें --</option>
                </select>
            </div>

            <div class="form-group">
                <label>खण्ड / Block <span class="mandatory">*</span></label>
                <select id="mainBlockSelect" onchange="onMainBlockChange()">
                    <option value="">-- पहले जिला चुनें --</option>
                </select>
            </div>

            <div class="form-group">
                <label>गाँव / Village <span class="mandatory">*</span></label>
                <select id="mainVillageSelect" onchange="onVillageSelected()">
                    <option value="">-- पहले ब्लॉक चुनें --</option>
                </select>
            </div>

            <button class="custom-btn" onclick="searchServices()">विवरण देखें</button>
            <div id="searchResult" style="margin-top: 10px;"></div>
        </div>

        <!-- 1. ADD SHOP FORM -->
        <div class="toggle-bar" onclick="toggleSection('addShopFormBox', 'icon1')">
            <span>🏪 1. दुकान / सेवा जोड़ें (Firebase)</span>
            <span id="icon1">▼</span>
        </div>

        <div class="collapsible-form-container" id="addShopFormBox">
            <div class="form-group">
                <label>दुकान का नाम:</label>
                <input type="text" id="regShopName" placeholder="उदा: वर्मा इलेक्ट्रॉनिक्स">
            </div>
            <div class="form-group">
                <label>जिला:</label>
                <select id="regDistrict" onchange="onRegDistrictChange()">
                    <option value="">-- जिला चुनें --</option>
                </select>
            </div>
            <div class="form-group">
                <label>ब्लॉक:</label>
                <select id="regBlock" onchange="onRegBlockChange()">
                    <option value="">-- पहले जिला चुनें --</option>
                </select>
            </div>
            <div class="form-group">
                <label>गाँव:</label>
                <select id="regVillage">
                    <option value="">-- पहले ब्लॉक चुनें --</option>
                </select>
            </div>
            <div class="form-group">
                <label>मोबाइल नंबर:</label>
                <input type="tel" id="regPhone" placeholder="10 अंकों का नंबर">
            </div>
            <div class="form-group">
                <label>दुकान की फोटो:</label>
                <input type="file" accept="image/*" onchange="previewImage(event, 'shopImgPrev', 'shopPhotoHolder')">
                <div class="photo-preview-box">
                    <span id="shopPhotoHolder" style="font-size: 0.8rem;">प्रिव्यू</span>
                    <img id="shopImgPrev" alt="Preview">
                </div>
            </div>
            <button type="button" class="custom-btn" onclick="submitShop()">दुकान लाइव दर्ज करें</button>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Haryana Rural Service Portal</p>
    </footer>

    <!-- सही फाइल नामों से लिंकेज -->
    <script src="haryana_data.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
