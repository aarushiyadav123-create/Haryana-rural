<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>District Block Village Fix</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    select { width: 100%; max-width: 300px; padding: 8px; }
  </style>
</head>
<body>

  <!-- Dropdowns -->
  <div class="form-group">
    <label>District:</label><br>
    <select id="district" onchange="loadBlocks()">
      <option value="">-- District Select Karein --</option>
      <option value="Rohtak">Rohtak</option>
      <option value="Jhajjar">Jhajjar</option>
    </select>
  </div>

  <div class="form-group">
    <label>Block:</label><br>
    <select id="block" onchange="loadVillages()" disabled>
      <option value="">-- Pehle District Select Karein --</option>
    </select>
  </div>

  <div class="form-group">
    <label>Gaon (Village):</label><br>
    <select id="village" disabled>
      <option value="">-- Pehle Block Select Karein --</option>
    </select>
  </div>

  <script>
    // Data Structure
    const locationData = {
      "rohtak": {
        "sampla": ["Sampla Gaon", "Ismaila", "Kharawar", "Gandal", "Bhasaur", "Atail"],
        "kalanaur": ["Kalanaur", "Anwal", "Khentawas", "Masoodpur"],
        "lakhan majra": ["Lakhan Majra", "Chandi", "Nindana"]
      },
      "jhajjar": {
        "bahadurgarh": ["Sankhol", "Bamdoli", "Rohad", "Siddhipur"],
        "beri": ["Beri", "Berli Khurd", "Berli Kalan", "Guraora"]
      }
    };

    // 1. Block Load Karne Ka Function
    function loadBlocks() {
      const distInput = document.getElementById("district").value.trim().toLowerCase();
      const blockSelect = document.getElementById("block");
      const villageSelect = document.getElementById("village");

      // Reset
      blockSelect.innerHTML = '<option value="">-- Select Block --</option>';
      villageSelect.innerHTML = '<option value="">-- Pehle Block Select Karein --</option>';
      villageSelect.disabled = true;

      if (distInput && locationData[distInput]) {
        blockSelect.disabled = false;
        
        const blocks = Object.keys(locationData[distInput]);
        blocks.forEach(blockKey => {
          let opt = document.createElement("option");
          opt.value = blockKey;
          // Capitalize Name for Display
          opt.textContent = blockKey.toUpperCase();
          blockSelect.appendChild(opt);
        });
      } else {
        blockSelect.disabled = true;
      }
    }

    // 2. Village Load Karne Ka Function
    function loadVillages() {
      const distInput = document.getElementById("district").value.trim().toLowerCase();
      const blockInput = document.getElementById("block").value.trim().toLowerCase();
      const villageSelect = document.getElementById("village");

      // Reset
      villageSelect.innerHTML = '<option value="">-- Select Gaon --</option>';

      if (distInput && blockInput && locationData[distInput] && locationData[distInput][blockInput]) {
        villageSelect.disabled = false;
        
        const villages = locationData[distInput][blockInput];
        villages.forEach(villageName => {
          let opt = document.createElement("option");
          opt.value = villageName;
          opt.textContent = villageName;
          villageSelect.appendChild(opt);
        });
      } else {
        villageSelect.disabled = true;
        console.log("Gaon nahi mila kyunki Match Nahi hua:", distInput, blockInput);
      }
    }
  </script>

</body>
</html>
