<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हरियाणा ग्राम सेवा पोर्टल</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding-bottom: 30px; }
        header { background: #2e7d32; color: white; padding: 15px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { color: #2e7d32; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; }
        select, input, button { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.95rem; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #1b5e20; }
        .collapsible-content { display: none; margin-top: 10px; }
        .otp-btn { background: #0288d1; margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <h2>🌾 हरियाणा ग्राम सेवा</h2>
    <p id="headerSubTitle" style="font-size: 0.85rem; margin-top: 4px;">राम राम भाइयों, आपके गाँव में स्वागत है</p>
</header>

<div class="container">

    <!-- 📍 1. मुख्य सर्च सेक्शन -->
    <div class="card">
        <h3>📍 अपना क्षेत्र चुनें</h3>
        
        <select id="mainDistrictSelect" onchange="loadBlocks()">
            <option value="">-- जिला चुनें --</option>
        </select>

        <select id="mainBlockSelect" onchange="loadVillages()">
            <option value="">-- पहले जिला चुनें --</option>
        </select>

        <select id="mainVillageSelect" onchange="checkOtherVillage(); updateHeaderVillageName();">
            <option value="">-- पहले ब्लॉक चुनें --</option>
        </select>

        <!-- लिस्ट में नाम न होने पर टाइप करने के लिए -->
        <input type="text" id="customVillageInput" placeholder="अपने गाँव का नाम लिखें" style="display:none;" />

        <button type="button" onclick="searchServices()" style="margin-top:12px;">🔍 सुविधाएँ ढूँढें</button>
        
        <div id="searchResult"></div>
    </div>

    <!-- 📢 2. विज्ञापन व सेवाएँ प्रदर्शित करने का क्षेत्र -->
    <div class="card">
        <h3>📢 गाँव की दुकान व सुविधाएँ</h3>
        <div id="adDisplayArea">
            <p style="color:#666; font-size:0.85rem;">ऊपर जिला, ब्लॉक और गाँव चुनकर 'सुविधाएँ ढूँढें' पर क्लिक करें।</p>
        </div>
    </div>

    <!-- ➕ 3. नई दुकान या सेवा दर्ज करने का सेक्शन -->
    <div class="card">
        <h3 onclick="toggleSection('regBox', 'regIcon')">
            ➕ नई दुकान/सेवा जोड़ें <span id="regIcon">▼</span>
        </h3>
        <div id="regBox" class="collapsible-content">
            <input type="text" id="regShopName" placeholder="दुकान/सेवा का नाम" />
            
            <input type="text" id="regPhone" placeholder="10 अंकों का मोबाइल नंबर" maxlength="10" />
            <button type="button" class="otp-btn" onclick="sendOTP()">OTP भेजें</button>
            
            <div id="otpBox" style="display:none;">
                <p style="font-size:0.8rem; color:#666; margin-top:5px;">टेस्ट OTP: <strong id="generatedOtpDisplay"></strong></p>
                <input type="text" id="userOtpInput" placeholder="OTP दर्ज करें" />
                <button type="button" onclick="verifyOTP()">OTP सत्यापित करें</button>
                <p id="otpStatusMsg" style="font-size:0.8rem; margin-top:3px;"></p>
            </div>

            <input type="text" id="adItemPrice" placeholder="कीमत या फ़ीस (उदा: 200 रु/विज़िट)" />

            <button type="button" onclick="submitAd()" style="margin-top:10px;">जाँच के लिए सबमिट करें</button>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
