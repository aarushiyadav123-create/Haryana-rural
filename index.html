<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा गाँव - हरियाणा ग्रामीण सेवा</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f6f9; padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 550px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
        h2 { color: #1b5e20; text-align: center; margin-bottom: 20px; font-size: 1.4rem; }
        .form-group { margin-bottom: 18px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.95rem; }
        select { width: 100%; padding: 12px; border: 1px solid #b0bec5; border-radius: 8px; font-size: 1rem; outline: none; background: #fff; cursor: pointer; }
        select:focus { border-color: #1b5e20; }
        .btn { background: #1b5e20; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #113f14; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #e8f5e9; border: 1px solid #a5d6a7; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌾 MeraGaov - Direct Master Offline</h2>

    <!-- 1. District -->
    <div class="form-group">
        <label>1. जिला (District):</label>
        <select id="distSelect" onchange="loadBlocks()">
            <option value="">-- जिला चुनें --</option>
        </select>
    </div>

    <!-- 2. Block -->
    <div class="form-group">
        <label>2. खण्ड (Block):</label>
        <select id="blockSelect" onchange="loadVillages()">
            <option value="">-- पहले जिला चुनें --</option>
        </select>
    </div>

    <!-- 3. Village -->
    <div class="form-group">
        <label>3. गाँव (Village):</label>
        <select id="villageSelect">
            <option value="">-- पहले ब्लॉक चुनें --</option>
        </select>
    </div>

    <button class="btn" onclick="showData()">विवरण देखें (View Details)</button>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    // Direct Self-Contained Haryana Master Database (No External APIs, No Fetch Error)
    const masterDB = {
        "CHARKHI DADRI": {
            "BAUND": ["Achina", "Akbarpur", "Balgarh", "Bas Ranila", "Baund Kalan", "Baund Khurd", "Bhagwi", "Dhani Phogat", "Gharethi", "Hindol", "Kalyana", "Mankawas", "Phogat", "Ranila", "Sanjarwas", "Sankrod"],
            "CHARKHI DADRI": ["Adalpur", "Bhiwani Gate", "Birhi Kalan", "Birhi Khurd", "Chhapar", "Dadri Rural", "Iri", "Jhojhu Kalan", "Kachri", "Khedi Bura", "Mehrana", "Ramalwas", "Samaspur", "Sarni", "Tikan Kalan"],
            "BADHRA": ["Badhra", "Chandwas", "Chhapar", "Ghuiyani", "Hansiwas", "Jhojhu Khurd", "Kadma", "Kallana", "Kheri Bura", "Lawa", "Mandola", "Nindana", "Penchead", "Surpura"]
        },
        "ROHTAK": {
            "SAMPLA": ["Atail", "Balku", "Bhadhadu", "Chandi", "Dattaur", "Gandhra", "Ghashi", "Gijhi", "Ismaila 11B", "Ismaila 9B", "Kheri Sampla", "Kultana", "Naya Bans", "Nonand", "Rohad", "Sampla"],
            "ROHTAK": ["Asthal Bohar", "Bhalout", "Bohar", "Kharawar", "Kheri Sadh", "Makrauli Kalan", "Paharipur", "Rohtak Rural", "Sunaria Kalan", "Sunaria Khurd"],
            "KALANAUR": ["Anwal", "Gudhan", "Kahnaur", "Kalanaur", "Kairi", "Katesara", "Masudpur", "Nigana"],
            "MEHAM": ["Baini City", "Farmana", "Madina Gindhran", "Madina Korsan", "Meham", "Mokhra Bahi", "Mokhra Khas", "Nidana", "Semnan"],
            "LAKHAN MAJRA": ["Brahmanwas", "Chandi", "Gharawathi", "Indergarh", "Kharak Jattan", "Lakhan Majra", "Nandwal", "Titian"]
        },
        "JHAJJAR": {
            "JHAJJAR": ["Bhurawas", "Dhani", "Giani", "Gudha", "Jhajjar Rural", "Kheri Khummar", "Kutani", "Silani", "Suhra", "Talao"],
            "BAHADURGARH": ["Asaudha Siwan", "Asaudha Todran", "Bahadurgarh Rural", "Bamnoli", "Barahi", "Daboda Kalan", "Daboda Khurd", "Jasaur Kheri", "Kanonda", "Rohad", "Sankhol", "Sidhipur Lova", "Soldha"],
            "BERI": ["Baghpur", "Beri", "Bisahan", "Chhara", "Dighal", "Dubaldhan", "Gangtan", "Gochhi", "Majra", "Wazirpur"],
            "BADLI": ["Badli", "Bupania", "Dulhera", "Gubhana", "Majri", "Munimpur", "Pahori", "Pelpa", "Yakubpur"]
        },
        "JIND": {
            "JIND": ["Barsola", "Bichpari", "Bishanpura", "Ekkas", "Gattoli", "Intal Kalan", "Intal Khurd", "Jind Rural", "Karsindhu"],
            "JULANA": ["Bhojraj", "Bramhanwala", "Gadhwal", "Gatra", "Jaijaiwanti", "Julana", "Karela", "Keral", "Lajwana Kalan"],
            "SAFIDON": ["Bahadurpur", "Hatt", "Muana", "Pillukhera", "Retoli", "Safidon", "Singhwal", "Sink"]
        }
    };

    // Load Districts
    window.onload = function() {
        let dist = document.getElementById('distSelect');
        for (let d in masterDB) {
            let opt = document.createElement('option');
            opt.value = d;
            opt.innerText = d;
            dist.appendChild(opt);
        }
    };

    function loadBlocks() {
        let d = document.getElementById('distSelect').value;
        let block = document.getElementById('blockSelect');
        let village = document.getElementById('villageSelect');

        block.innerHTML = '<option value="">-- खण्ड / Block चुनें --</option>';
        village.innerHTML = '<option value="">-- पहले ब्लॉक चुनें --</option>';

        if (d && masterDB[d]) {
            for (let b in masterDB[d]) {
                let opt = document.createElement('option');
                opt.value = b;
                opt.innerText = b;
                block.appendChild(opt);
            }
        }
    }

    function loadVillages() {
        let d = document.getElementById('distSelect').value;
        let b = document.getElementById('blockSelect').value;
        let village = document.getElementById('villageSelect');

        village.innerHTML = '<option value="">-- गाँव / Village चुनें --</option>';

        if (d && b && masterDB[d][b]) {
            masterDB[d][b].forEach(v => {
                let opt = document.createElement('option');
                opt.value = v;
                opt.innerText = v;
                village.appendChild(opt);
            });
        }
    }

    function showData() {
        let d = document.getElementById('distSelect').value;
        let b = document.getElementById('blockSelect').value;
        let v = document.getElementById('villageSelect').value;

        if (!d || !b || !v) {
            alert('कृपया जिला, ब्लॉक और गाँव तीनों चुनें!');
            return;
        }

        let res = document.getElementById('resultBox');
        res.style.display = 'block';
        res.innerHTML = `<strong>📍 चुना गया विवरण:</strong><br>जिला: ${d}<br>ब्लॉक: ${b}<br>गाँव: ${v}`;
    }
</script>

</body>
</html>
