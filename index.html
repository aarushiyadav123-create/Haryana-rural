<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हरियाणा ग्रामीण सेवा</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #1b5e20; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; }
        button { background: #1b5e20; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>हरियाणा ग्रामीण सेवा</h1>
        <label>जिला चुनें:</label>
        <select id="district"><option value="rohtak">रोहतक</option></select>
        <input type="text" id="village" placeholder="गाँव का नाम">
        <button onclick="alert('खोज जारी है...')">दुकानें देखें</button>
    </div>
</body>
</html>
