<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा गाँव - हरियाणा ग्रामीण सेवा</title>
    <style>
        :root { --primary: #1b5e20; --secondary: #ff8f00; --bg-color: #f4f6f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); padding: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { background: var(--primary); color: #fff; padding: 10px; border-radius: 6px; font-size: 1.1rem; }
        .form-group { margin-top: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        .btn { background: var(--primary); color: white; padding: 12px; width: 100%; border: none; border-radius: 5px; font-weight: bold; font-size: 1rem; margin-top: 15px; cursor: pointer; }
        .item-box { background: #e8f5e9; padding: 10px; margin-top: 10px; border-radius: 6px; border-left: 5px solid var(--primary); }
    </style>
</head>
<body>

<div class="card">
    <h2>🌾 हरियाणा ग्रामीण सेवा पोर्टल</h2>
    
    <div class="form-group">
        <label>जिला / District:</label>
        <select id="distSelect" onchange="loadBlocks()">
            <option value="">-- जिला चुनें --</option>
        </select>
    </div>

    <div class="form-group">
        <label>खण्ड / Block:</label>
        <select id="blockSelect" onchange="loadVillages()">
            <option value="">-- पहले जिला चुनें --</option>
        </select>
    </div>

    <div class="form-group">
        <label>गाँव / Village:</label>
        <select id="villSelect">
            <option value="">-- पहले ब्लॉक चुनें --</option>
        </select>
    </div>

    <button class="btn" onclick="showData()">डेटा देखें / Search</button>
    
    <div id="resultBox" style="margin-top: 20px;"></div>
</div>

<script>
    const data = {
        "ROHTAK": {
            "ROHTAK": ["Ismaila", "Dobh", "Kahnaur", "Bohar", "Kiloi", "Sanghi"],
            "SAMPLA": ["Sampla", "Ismaila-A", "Ismaila-B", "Assan", "Katesra"],
            "MEHAM": ["Meham", "Madina", "Bainsi"]
        },
        "JHAJJAR": {
            "JHAJJAR": ["Jhajjar Rural", "Bahadurgarh", "Beri", "Silani", "Dighal"],
            "BAHADURGARH": ["Bahadurgarh", "Asaudha", "Badli"]
        },
        "BHIWANI": {
            "BHIWANI": ["Bhiwani Rural", "Dinod", "Talu", "Bapora"],
            "TOSHAM": ["Tosham", "Khanak", "Dhandalan"]
        }
    };

    window.onload = function() {
        const dist = document.getElementById('distSelect');
        dist.innerHTML = '<option value="">-- जिला चुनें --</option>';
        for(let d in data) {
            dist.innerHTML += `<option value="${d}">${d}</option>`;
        }
    };

    function loadBlocks() {
        const d = document.getElementById('distSelect').value;
        const b = document.getElementById('blockSelect');
        const v = document.getElementById('villSelect');
        b.innerHTML = '<option value="">-- ब्लॉक चुनें --</option>';
        v.innerHTML = '<option value="">-- पहले ब्लॉक चुनें --</option>';
        
        if(d && data[d]) {
            for(let block in data[d]) {
                b.innerHTML += `<option value="${block}">${block}</option>`;
            }
        }
    }

    function loadVillages() {
        const d = document.getElementById('distSelect').value;
        const b = document.getElementById('blockSelect').value;
        const v = document.getElementById('villSelect');
        v.innerHTML = '<option value="">-- गाँव चुनें --</option>';
        
        if(d && b && data[d] && data[d][b]) {
            data[d][b].forEach(vill => {
                v.innerHTML += `<option value="${vill}">${vill}</option>`;
            });
        }
    }

    function showData() {
        const vill = document.getElementById('villSelect').value;
        const res = document.getElementById('resultBox');
        if(!vill) {
            alert("कृपया गाँव चुनें!");
            return;
        }
        res.innerHTML = `<div class="item-box">
            <h4>📍 गाँव: ${vill}</h4>
            <p>पोर्टल सफलतापूर्वक लोड हो गया है। आपका लोकल डेटा पूरी तरह सुरक्षित है।</p>
        </div>`;
    }
</script>
</body>
</html>
