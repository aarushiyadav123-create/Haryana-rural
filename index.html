<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हरियाणा ग्रामीण सेवा - डिजिटल ग्राम पोर्टल</title>
    <style>
        :root {
            --primary: #1b5e20;
            --secondary: #ff8f00;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 50px; }
        
        /* Header */
        header { background: linear-gradient(135deg, var(--primary), #2e7d32); color: white; padding: 25px 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        header p { font-size: 0.95rem; opacity: 0.9; }

        /* Main Container */
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        /* Cards */
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card h2 { font-size: 1.2rem; color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }

        /* Form Controls */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; outline: none; background: #fafafa; }
        select:focus, input:focus { border-color: var(--primary); background: #fff; }

        .btn { display: block; width: 100%; background: var(--primary); color: white; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .btn:hover { background: #2e7d32; }
        .btn-secondary { background: var(--secondary); margin-top: 10px; }
        .btn-secondary:hover { background: #e65100; }

        /* Results & Listings */
        .result-box { margin-top: 15px; }
        .shop-item { background: #f9f9f9; border-left: 4px solid var(--primary); padding: 12px; margin-bottom: 10px; border-radius: 6px; }
        .shop-item h4 { color: var(--primary); font-size: 1rem; }
        .shop-item p { font-size: 0.85rem; color: #666; margin-top: 3px; }

        /* Admin Panel Hidden */
        .admin-section { display: none; margin-top: 20px; background: #fffde7; border: 1px dashed var(--secondary); padding: 15px; border-radius: 8px; }
        
        /* Footer */
        footer { text-align: center; font-size: 0.8rem; color: #777; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <h1>हरियाणा ग्रामीण सेवा</h1>
        <p>गाँव की हर दुकान, हर सेवा - अब आपके मोबाइल पर</p>
    </header>

    <div class="container">

        <!-- गाँव और सेवा खोजें -->
        <div class="card">
            <h2>🔍 अपने गाँव की सेवाएँ खोजें</h2>
            <div class="form-group">
                <label>जिला चुनें:</label>
                <select id="districtSelect">
                    <option value="">-- जिला चुनें --</option>
                    <option value="rohtak">रोहतक</option>
                    <option value="bhiwani">भिवानी</option>
                    <option value="hisar">हिसार</option>
                    <option value="charkhi_dadri">चरखी दादरी</option>
                </select>
            </div>

            <div class="form-group">
                <label>गाँव का नाम:</label>
                <input type="text" id="villageInput" placeholder="गाँव का नाम लिखें...">
            </div>

            <button class="btn" onclick="searchServices()">दुकानें देखें</button>

            <div class="result-box" id="searchResult">
                <!-- यहाँ दुकानें दिखेंगी -->
            </div>
        </div>

        <!-- दुकान या सेवा रजिस्टर करने का फॉर्म -->
        <div class="card">
            <h2>📝 अपनी दुकान / सेवा यहाँ रजिस्टर करें</h2>
            <div class="form-group">
                <label>दुकान या सेवा का नाम:</label>
                <input type="text" id="regShopName" placeholder="जैसे: शर्मा किराना स्टोर">
            </div>
            <div class="form-group">
                <label>गाँव का नाम:</label>
                <input type="text" id="regVillage" placeholder="गाँव का नाम">
            </div>
            <div class="form-group">
                <label>श्रेणी (Category):</label>
                <select id="regCategory">
                    <option value="kirana">किराना / जनरल स्टोर</option>
                    <option value="medical">मेडिकल / दवाइयां</option>
                    <option value="repair">रिपेयरिंग (इलेक्ट्रॉनिक्स/वाहन)</option>
                    <option value="tractor">ट्रैक्टर / कृषि सेवा</option>
                    <option value="other">अन्य सेवा</option>
                </select>
            </div>
            <div class="form-group">
                <label>मोबाइल नंबर:</label>
                <input type="tel" id="regPhone" placeholder="10 अंकों का मोबाइल नंबर">
            </div>
            <button class="btn" onclick="registerService()">रजिस्टर करें</button>
        </div>

        <!-- एडमिन लॉगिन पैनल -->
        <div class="card" style="text-align: center;">
            <button class="btn btn-secondary" onclick="toggleAdminPanel()">🔒 एडमिन लॉगिन पैनल</button>
            
            <div class="admin-section" id="adminPanel">
                <h3 style="color: #e65100; margin-bottom: 10px; font-size: 1rem;">एडमिन नियंत्रण कक्ष</h3>
                <input type="password" id="adminPass" placeholder="पासवर्ड दर्ज करें (admin123)" style="margin-bottom: 10px;">
                <button class="btn" onclick="verifyAdmin()" style="padding: 8px;">लॉगिन करें</button>
                <div id="adminControls" style="display:none; margin-top: 10px;">
                    <p style="color: green; font-weight: bold; font-size: 0.9rem;">✔ एडमिन एक्सेस मिल गया!</p>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 हरियाणा ग्रामीण सेवा पोर्टल | सर्वाधिकार सुरक्षित</p>
    </footer>

    <script>
        function searchServices() {
            const village = document.getElementById('villageInput').value.trim();
            const resultBox = document.getElementById('searchResult');
            
            if(!village) {
                alert('कृपया पहले गाँव का नाम लिखें!');
                return;
            }

            let savedShops = JSON.parse(localStorage.getItem('ruralShops') || '[]');
            let filtered = savedShops.filter(s => s.village.toLowerCase() === village.toLowerCase());

            let html = `<h3 style="font-size: 1rem; margin-bottom: 10px; color: #333;">'${village}' में उपलब्ध सेवाएँ:</h3>`;
            
            html += `
                <div class="shop-item">
                    <h4>श्री श्याम जनरल स्टोर (डिफ़ॉल्ट)</h4>
                    <p>श्रेणी: किराना | संपर्क: 9876543210</p>
                </div>
            `;

            if(filtered.length > 0) {
                filtered.forEach(s => {
                    html += `
                        <div class="shop-item">
                            <h4>${s.name}</h4>
                            <p>श्रेणी: ${s.category} | संपर्क: ${s.phone}</p>
                        </div>
                    `;
                });
            }

            resultBox.innerHTML = html;
        }

        function registerService() {
            const name = document.getElementById('regShopName').value;
            const village = document.getElementById('regVillage').value;
            const category = document.getElementById('regCategory').value;
            const phone = document.getElementById('regPhone').value;

            if(!name || !village || !phone) {
                alert('कृपया सभी जानकारी सही से भरें!');
                return;
            }

            let newShop = { name, village, category, phone };
            let savedShops = JSON.parse(localStorage.getItem('ruralShops') || '[]');
            savedShops.push(newShop);
            localStorage.setItem('ruralShops', JSON.stringify(savedShops));

            alert('सफलतापूर्वक रजिस्टर हो गया!');
            document.getElementById('regShopName').value = '';
            document.getElementById('regVillage').value = '';
            document.getElementById('regPhone').value = '';
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === 'admin123') {
                document.getElementById('adminControls').style.display = 'block';
                alert('लॉगिन सफल!');
            } else {
                alert('गलत पासवर्ड!');
            }
        }
    </script>
</body>
</html>
